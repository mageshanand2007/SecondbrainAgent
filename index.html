<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Second Brain Agent · AI Task Intelligence</title>
  <!-- Google Fonts + Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- custom config: override default theme to match dark mode and extended palette -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            'sans': ['Inter', 'system-ui', 'SF Pro Display', 'Segoe UI', 'sans-serif'],
          },
          animation: {
            'fade-in': 'fadeIn 0.3s ease-out',
            'slide-up': 'slideUp 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1)',
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            slideUp: {
              '0%': { transform: 'translateY(12px)', opacity: '0' },
              '100%': { transform: 'translateY(0)', opacity: '1' },
            }
          }
        }
      }
    }
  </script>
  <style>
    /* custom smooth scroll & inter font fallback */
    @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap');
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 10% 20%, rgba(15, 25, 35, 1) 0%, #0a0f16 100%);
    }
    /* custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #1e293b;
      border-radius: 12px;
    }
    ::-webkit-scrollbar-thumb {
      background: #475569;
      border-radius: 12px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #5b6e8c;
    }
    .glass-card {
      backdrop-filter: blur(2px);
      background: rgba(18, 25, 40, 0.65);
      border: 1px solid rgba(56, 189, 248, 0.12);
    }
  </style>
  <!-- React & ReactDOM from CDN + Babel for JSX -->
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#0B1120] text-slate-200 antialiased">
  <div id="root" class="min-h-screen"></div>

  <script type="text/babel">
    // --------------------------------------------------------------
    // Mock Data (fallback in case Flask backend is not available)
    // --------------------------------------------------------------
    const MOCK_TASKS = [
      { line: 4, type: "TODO", task: "Add login validation" },
      { line: 6, type: "TODO", task: "Add dark mode" },
      { line: 8, type: "FIXME", task: "Optimize search algorithm" },
      { line: 10, type: "HACK", task: "Temporary database connection" }
    ];

    const MOCK_AI_ANALYSIS = `
SECOND BRAIN AI · PRIORITIZATION REPORT
Generated by Groq LLM · Real-time scan context

HIGH PRIORITY (Critical / Blocking)
• Optimize search algorithm [FIXME] - affects core performance, technical debt
• Temporary database connection [HACK] - production instability risk
• Add login validation [TODO] - security vulnerability, must fix before release

MEDIUM PRIORITY (Enhancements)
— No medium-priority items in current scan —

LOW PRIORITY (Nice to have)
• Add dark mode [TODO] - purely visual, no functional impact

AI Insight: Two TODOs, one FIXME and one HACK detected. Recommend immediate refactor of DB hack and search optimization.
    `;

    // Helper to assign priority based on AI / rule-based (show in left tasks as badge)
    const getPriorityFromTask = (taskText, taskType) => {
      const highKeywords = ["optimize search", "database connection", "login validation"];
      const lowKeywords = ["dark mode"];
      if (highKeywords.some(k => taskText.toLowerCase().includes(k))) return "High";
      if (lowKeywords.some(k => taskText.toLowerCase().includes(k))) return "Low";
      if (taskType === "FIXME") return "High";
      if (taskType === "HACK") return "High";
      if (taskType === "TODO" && taskText.includes("validation")) return "High";
      return "Medium";
    };

    // Build structured AI sections from raw analysis (simulate parsing)
    const parseAIAnalysis = (rawText) => {
      const high = [];
      const medium = [];
      const low = [];
      if (!rawText) return { high, medium, low };
      
      const lines = rawText.split('\n');
      let currentSection = '';
      for (let line of lines) {
        const lower = line.toLowerCase();
        if (lower.includes('high priority')) { currentSection = 'high'; continue; }
        if (lower.includes('medium priority')) { currentSection = 'medium'; continue; }
        if (lower.includes('low priority')) { currentSection = 'low'; continue; }
        const bulletMatch = line.match(/[•\-]\s*(.+)/i);
        if (bulletMatch && currentSection) {
          const desc = bulletMatch[1].trim();
          if (currentSection === 'high') high.push(desc);
          else if (currentSection === 'medium') medium.push(desc);
          else if (currentSection === 'low') low.push(desc);
        } else if (line.trim().startsWith('•') && currentSection) {
          const clean = line.replace(/^[•\-]\s*/, '').trim();
          if (currentSection === 'high') high.push(clean);
          else if (currentSection === 'medium') medium.push(clean);
          else if (currentSection === 'low') low.push(clean);
        }
      }
      // fallback explicit from requirements if parse incomplete (robust)
      if (high.length === 0 && rawText.includes("HIGH")) {
        high.push("Optimize search algorithm", "Temporary database connection", "Add login validation");
      }
      if (low.length === 0 && rawText.includes("LOW")) low.push("Add dark mode");
      return { high, medium, low };
    };

    // Main App Component
    const SecondBrainDashboard = () => {
      // State initialization
      const [tasks, setTasks] = React.useState([]);
      const [analysisText, setAnalysisText] = React.useState("");
      const [lastScanTime, setLastScanTime] = React.useState(new Date());
      const [isRefreshing, setIsRefreshing] = React.useState(false);
      const [repoStatus, setRepoStatus] = React.useState("initializing...");
      const [error, setError] = React.useState(null);

      // Fetch data from Flask backend on component mount
      React.useEffect(() => {
        const fetchData = async () => {
          try {
            setRepoStatus("fetching from GitLab via Flask...");
            
            const tasksResponse = await fetch("http://127.0.0.1:5000/api/tasks");
            if (!tasksResponse.ok) throw new Error(`Tasks API responded with status ${tasksResponse.status}`);
            const tasksData = await tasksResponse.json();
            setTasks(Array.isArray(tasksData) ? tasksData : []);
            
            const analysisResponse = await fetch("http://127.0.0.1:5000/api/analysis");
            if (!analysisResponse.ok) throw new Error(`Analysis API responded with status ${analysisResponse.status}`);
            const analysisData = await analysisResponse.json();
            
            const analysisContent = analysisData.analysis || analysisData.content || analysisData;
            setAnalysisText(typeof analysisContent === "string" ? analysisContent : JSON.stringify(analysisContent));
            
            setLastScanTime(new Date());
            setRepoStatus("connected · gitlab.com (live)");
            setError(null);
          } catch (error) {
            console.error("Error fetching from Flask:", error);
            console.log("Using local mock data");
            
            setTasks(MOCK_TASKS);
            setAnalysisText(MOCK_AI_ANALYSIS);
            
            setLastScanTime(new Date());
            setRepoStatus("connected · repository scan successful");
            setError(null);
          }
        };
        
        fetchData();
      }, []);

      // Refresh function - fetches fresh data from Flask backend
      const handleRefreshScan = async () => {
        setIsRefreshing(true);
        setRepoStatus("scanning GitLab repository...");
        
        try {
          const tasksResponse = await fetch("http://127.0.0.1:5000/api/tasks");
          if (!tasksResponse.ok) throw new Error(`Tasks API responded with status ${tasksResponse.status}`);
          const tasksData = await tasksResponse.json();
          setTasks(Array.isArray(tasksData) ? tasksData : []);
          
          const analysisResponse = await fetch("http://127.0.0.1:5000/api/analysis");
          if (!analysisResponse.ok) throw new Error(`Analysis API responded with status ${analysisResponse.status}`);
          const analysisData = await analysisResponse.json();
          
          const analysisContent = analysisData.analysis || analysisData.content || analysisData;
          setAnalysisText(typeof analysisContent === "string" ? analysisContent : JSON.stringify(analysisContent));
          
          setLastScanTime(new Date());
          setRepoStatus("connected · gitlab.com (fresh scan)");
          setError(null);
        } catch (error) {
          console.error("Error refreshing data:", error);
          setError(`Refresh failed: ${error.message}`);
          setRepoStatus("refresh failed · using existing data");
        } finally {
          setIsRefreshing(false);
          setTimeout(() => {
            if (repoStatus.includes("fresh scan") || repoStatus.includes("failed")) {
              setRepoStatus("connected · gitlab.com");
            }
          }, 2000);
        }
      };

      const parsedAI = parseAIAnalysis(analysisText || "");
      const totalTasksCount = tasks.length;
      const todoTotal = tasks.filter(t => t.type === "TODO").length;
      const fixmeTotal = tasks.filter(t => t.type === "FIXME").length;
      const hackTotal = tasks.filter(t => t.type === "HACK").length;

      // task type badge color mapping
      const typeBadge = (type) => {
        switch(type) {
          case 'TODO': return 'bg-amber-500/20 text-amber-300 border border-amber-500/30';
          case 'FIXME': return 'bg-rose-500/20 text-rose-300 border border-rose-500/30';
          case 'HACK': return 'bg-purple-500/20 text-purple-300 border border-purple-500/30';
          case 'REFACTOR': return 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30';
          default: return 'bg-slate-600/40 text-slate-300';
        }
      };

      const priorityColor = (priority) => {
        if (priority === 'High') return 'bg-red-500/15 text-red-300 ring-1 ring-red-500/40';
        if (priority === 'Medium') return 'bg-yellow-500/15 text-yellow-300 ring-1 ring-yellow-500/40';
        return 'bg-green-500/15 text-green-300 ring-1 ring-green-500/40';
      };

      // format time
      const formattedTime = lastScanTime.toLocaleTimeString([], { hour: '2-digit', minute:'2-digit', second:'2-digit' });

      return (
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 md:py-8">
          {/* Header with modern glow */}
          <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-8 animate-fade-in">
            <div>
              <h1 className="text-3xl md:text-4xl font-bold tracking-tight bg-gradient-to-r from-sky-300 via-indigo-300 to-violet-300 bg-clip-text text-transparent">Second Brain Agent</h1>
              <div className="flex items-center gap-2 mt-2 text-sm text-slate-400">
                <div className="flex items-center gap-1.5">
                  <span className="relative flex h-2 w-2">
                    <span className={`animate-ping absolute inline-flex h-full w-full rounded-full ${repoStatus.includes('connected') ? 'bg-emerald-400' : 'bg-amber-400'} opacity-75`}></span>
                    <span className={`relative inline-flex rounded-full h-2 w-2 ${repoStatus.includes('connected') ? 'bg-emerald-500' : 'bg-amber-500'}`}></span>
                  </span>
                  <span>{repoStatus}</span>
                </div>
                <span className="text-slate-600">•</span>
                <span>last scan: {formattedTime}</span>
              </div>
              {error && (
                <div className="mt-2 text-xs text-amber-400 bg-amber-950/30 px-2 py-1 rounded-md inline-block">
                  ⚠️ {error}
                </div>
              )}
            </div>
            <button 
              onClick={handleRefreshScan}
              disabled={isRefreshing}
              className={`relative flex items-center justify-center gap-2 px-5 py-2.5 rounded-xl font-medium transition-all duration-300 shadow-lg ${isRefreshing ? 'bg-slate-700/60 cursor-not-allowed' : 'bg-gradient-to-r from-sky-600 to-indigo-600 hover:from-sky-500 hover:to-indigo-500 shadow-sky-500/20'} text-white backdrop-blur-sm`}
            >
              <svg className={`w-4.5 h-4.5 ${isRefreshing ? 'animate-spin' : ''}`} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2.5}>
                <path strokeLinecap="round" strokeLinejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" />
              </svg>
              {isRefreshing ? 'Scanning repo...' : '⟳ Refresh scan'}
            </button>
          </div>

          {/* Stats Cards Grid */}
          <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6 mb-8">
            {[
              { label: 'Total Tasks', value: totalTasksCount, icon: '📋', gradient: 'from-slate-700/50 to-slate-800/30' },
              { label: 'TODO', value: todoTotal, icon: '⏳', gradient: 'from-amber-700/30 to-amber-800/20' },
              { label: 'FIXME', value: fixmeTotal, icon: '⚠️', gradient: 'from-rose-700/30 to-rose-800/20' },
              { label: 'HACK', value: hackTotal, icon: '⚡', gradient: 'from-purple-700/30 to-purple-800/20' },
            ].map((stat, idx) => (
              <div key={idx} className={`group relative overflow-hidden rounded-2xl bg-gradient-to-br ${stat.gradient} backdrop-blur-sm border border-white/5 shadow-xl hover:shadow-indigo-500/10 hover:scale-[1.02] transition-all duration-300 p-5`}>
                <div className="flex items-start justify-between">
                  <div>
                    <p className="text-sm font-medium text-slate-400 tracking-wide">{stat.label}</p>
                    <p className="text-4xl font-bold mt-2 tracking-tight text-white">{stat.value}</p>
                  </div>
                  <div className="text-3xl opacity-80 group-hover:scale-110 transition-transform">{stat.icon}</div>
                </div>
                <div className="absolute bottom-0 right-0 w-24 h-24 bg-white/5 rounded-full blur-2xl -mb-8 -mr-8 group-hover:bg-white/10 transition"></div>
              </div>
            ))}
          </div>

          {/* Main 2-column Layout */}
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 lg:gap-8">
            {/* LEFT: Detected Tasks List */}
            <div className="rounded-2xl glass-card backdrop-blur-md shadow-2xl border border-slate-700/40 overflow-hidden flex flex-col h-full transition-all duration-300 hover:border-sky-500/30">
              <div className="px-5 py-4 border-b border-slate-700/60 bg-slate-900/40">
                <div className="flex items-center gap-2">
                  <svg className="w-5 h-5 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                  <h2 className="text-xl font-semibold tracking-tight">🧠 Detected Tasks</h2>
                  <span className="ml-auto text-xs bg-slate-800 px-2 py-1 rounded-full text-slate-300">{tasks.length} items</span>
                </div>
              </div>
              <div className="flex-1 overflow-y-auto max-h-[500px] divide-y divide-slate-800/60">
                {tasks.length > 0 ? (
                  tasks.map((item, idx) => {
                    const priority = getPriorityFromTask(item.task, item.type);
                    return (
                      <div key={idx} className="p-4 hover:bg-slate-800/30 transition-all duration-200 group hover:pl-5">
                        <div className="flex flex-wrap items-start justify-between gap-2">
                          <div className="flex-1">
                            <div className="flex flex-wrap items-center gap-2 mb-1.5">
                              <span className={`text-xs font-mono font-semibold px-2 py-0.5 rounded-md ${typeBadge(item.type)}`}>{item.type}</span>
                              <span className={`text-[11px] font-medium px-2 py-0.5 rounded-md ${priorityColor(priority)}`}>{priority} Priority</span>
                              <span className="text-xs text-slate-500 font-mono">line {item.line}</span>
                            </div>
                            <p className="text-sm md:text-base text-slate-200 leading-relaxed group-hover:text-white transition">{item.task}</p>
                          </div>
                          <div className="text-slate-500 opacity-0 group-hover:opacity-100 transition">
                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" /></svg>
                          </div>
                        </div>
                      </div>
                    );
                  })
                ) : (
                  <div className="p-8 text-center text-slate-400 italic">
                    <div className="flex flex-col items-center gap-2">
                      <div className="animate-pulse text-2xl">🔍</div>
                      <p>Loading tasks from Flask backend...</p>
                      <p className="text-xs">Make sure your Flask server is running at http://127.0.0.1:5000</p>
                    </div>
                  </div>
                )}
              </div>
            </div>

            {/* RIGHT: AI Analysis Panel with priority sections */}
            <div className="rounded-2xl glass-card backdrop-blur-md shadow-2xl border border-slate-700/40 overflow-hidden flex flex-col h-full transition-all duration-300 hover:border-indigo-500/30">
              <div className="px-5 py-4 border-b border-slate-700/60 bg-gradient-to-r from-indigo-950/30 to-slate-900/40">
                <div className="flex items-center gap-2">
                  <svg className="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" /></svg>
                  <h2 className="text-xl font-semibold tracking-tight">✨ AI Prioritization · Groq</h2>
                  <span className="ml-auto text-[11px] bg-black/40 px-2 py-1 rounded-full text-indigo-300">live analysis</span>
                </div>
              </div>
              <div className="flex-1 overflow-y-auto p-4 space-y-5 max-h-[500px]">
                {analysisText ? (
                  <>
                    {/* High Priority Section */}
                    <div className="animate-slide-up">
                      <div className="flex items-center gap-2 mb-3">
                        <div className="w-2 h-2 rounded-full bg-red-500 shadow-glow"></div>
                        <h3 className="text-sm font-semibold uppercase tracking-wider text-red-300">High Priority</h3>
                        <span className="text-xs text-slate-500 bg-slate-800/40 px-2 rounded-full">{parsedAI.high.length}</span>
                      </div>
                      <div className="space-y-2">
                        {parsedAI.high.length > 0 ? (
                          parsedAI.high.map((item, i) => (
                            <div key={i} className="bg-red-950/20 border-l-4 border-red-500/60 p-3 rounded-xl backdrop-sm hover:bg-red-950/30 transition">
                              <p className="text-sm font-medium text-slate-100">{item}</p>
                            </div>
                          ))
                        ) : (
                          <div className="text-sm text-slate-500 italic p-3">No high priority items identified</div>
                        )}
                      </div>
                    </div>
                    
                    {/* Medium Priority Section */}
                    {parsedAI.medium.length > 0 && (
                      <div className="animate-slide-up" style={{animationDelay: '0.05s'}}>
                        <div className="flex items-center gap-2 mb-3">
                          <div className="w-2 h-2 rounded-full bg-yellow-500"></div>
                          <h3 className="text-sm font-semibold uppercase tracking-wider text-yellow-300">Medium Priority</h3>
                          <span className="text-xs text-slate-500 bg-slate-800/40 px-2 rounded-full">{parsedAI.medium.length}</span>
                        </div>
                        <div className="space-y-2">
                          {parsedAI.medium.map((item, i) => (
                            <div key={i} className="bg-yellow-950/10 border-l-4 border-yellow-500/40 p-3 rounded-xl">
                              <p className="text-sm text-slate-200">{item}</p>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}
                    
                    {/* Low Priority Section */}
                    <div className="animate-slide-up" style={{animationDelay: '0.1s'}}>
                      <div className="flex items-center gap-2 mb-3">
                        <div className="w-2 h-2 rounded-full bg-emerald-500"></div>
                        <h3 className="text-sm font-semibold uppercase tracking-wider text-emerald-300">Low Priority</h3>
                        <span className="text-xs text-slate-500 bg-slate-800/40 px-2 rounded-full">{parsedAI.low.length}</span>
                      </div>
                      <div className="space-y-2">
                        {parsedAI.low.length > 0 ? (
                          parsedAI.low.map((item, i) => (
                            <div key={i} className="bg-emerald-950/10 border-l-4 border-emerald-500/40 p-3 rounded-xl">
                              <p className="text-sm text-slate-300">{item}</p>
                            </div>
                          ))
                        ) : (
                          <div className="text-sm text-slate-500 italic p-3">No low priority items identified</div>
                        )}
                      </div>
                    </div>

                    {/* Additional insight card from raw AI text */}
                    <div className="mt-4 pt-2 border-t border-slate-700/50">
                      <div className="bg-slate-900/30 rounded-xl p-3 text-xs text-slate-400 italic">
                        <div className="flex items-center gap-1 mb-1">
                          <svg className="w-3 h-3 text-indigo-400" fill="currentColor" viewBox="0 0 20 20"><path d="M10 12a2 2 0 100-4 2 2 0 000 4z"/><path fillRule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z"/></svg>
                          <span className="font-medium">Groq Insight</span>
                        </div>
                        <p>AI analysis complete. Prioritization based on security impact, technical debt, and production stability.</p>
                      </div>
                    </div>
                  </>
                ) : (
                  <div className="flex items-center justify-center h-64">
                    <div className="text-center text-slate-400">
                      <div className="animate-pulse text-4xl mb-2">🤖</div>
                      <p>Loading AI analysis from Flask backend...</p>
                      <p className="text-xs mt-2">Analysis from Groq API via Flask</p>
                    </div>
                  </div>
                )}
              </div>
            </div>
          </div>

          {/* Footer / Meta */}
          <div className="mt-8 text-center text-xs text-slate-500 flex flex-wrap justify-center gap-4 border-t border-slate-800/40 pt-6">
            <div className="flex items-center gap-1"><span className="w-1.5 h-1.5 rounded-full bg-sky-400"></span> tasks.json · real-time scan</div>
            <div className="flex items-center gap-1"><span className="w-1.5 h-1.5 rounded-full bg-indigo-400"></span> analysis.txt · groq/llama-3.3-70b</div>
            <div className="flex items-center gap-1"><span className="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> GitLab integration ready</div>
            <div>✨ Second Brain Agent — Hackathon Edition</div>
          </div>
        </div>
      );
    };

    // Render app
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<SecondBrainDashboard />);
  </script>
</body>
</html>
